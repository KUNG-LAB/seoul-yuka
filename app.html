<!DOCTYPE html>
<!--
  서울육아 앱 받기 — 휴대폰 종류에 맞는 스토어로 바로 보낸다.
    안드로이드 → Google Play · iPhone · iPad → App Store · 그 밖(PC 등) → 소개 페이지(index.html)
  2026-10-28 사용자 'B안': 인스타 '게시물 홍보하기'의 웹사이트 칸은 주소가 하나뿐이라, 한 주소로 두 스토어에 보내려고 만들었다.
  광고 · 프로필 링크 기록: md_files/seoul_yuka/INSTAGRAM_PROMO.md '광고 판 (10-27)'.
  버튼 세 개 · 주소 · 색은 index.html의 '앱 받기'와 같게 둔다 — 한쪽을 바꾸면 다른 쪽도 고친다.
  넘기지 못하는 때(스크립트를 막은 브라우저 등)를 위해 화면에도 버튼을 둔다. 주소 끝에 ?stay를 붙이면 넘기지 않고 이 화면만 보여 준다(확인용).

  이 파일은 공개됩니다. 다음은 절대 넣지 않습니다: 서버 · 계정 정보, 인증키 · 토큰, 저장소 이름, 이 계정에서 운영 중인 다른 프로그램 언급.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 넘겨주기만 하는 페이지라 검색에 싣지 않는다. AI 학습 · 자동 수집 거부는 index.html과 같다(POLICY_PAGES.md '자동 수집 금지'). -->
<meta name="robots" content="noindex, noai, noimageai">
<title>서울육아 — 앱 받기</title>
<meta name="description" content="서울육아 앱을 Google Play · App Store · 앱인토스에서 받습니다.">
<script>
  // 그리기 전에 넘긴다(화면이 잠깐 보였다 사라지지 않게). replace라 뒤로 가기를 누르면 이 페이지가 아니라 들어온 곳(광고)으로 돌아간다.
  (function () {
    if (/[?&]stay(=|&|$)/.test(location.search)) return;
    var ua = navigator.userAgent || '';
    // iPadOS 13부터 iPad는 맥처럼 자신을 알린다 — 터치가 되는 'MacIntel'은 iPad로 본다.
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (/Android/i.test(ua)) location.replace('https://play.google.com/store/apps/details?id=kr.moamoa.news');
    else if (ios) location.replace('https://apps.apple.com/kr/app/id6820169217');
    else location.replace('./');
  })();
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #5f6368;
    --line: #e3e5e8; --card: #f7f8fa; --accent: #2f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e8eaed; --muted: #9aa0a6;
      --line: #2c2f34; --card: #1c1f24; --accent: #7aa2f7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
                 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.7; font-size: 16px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 72px; }
  h1 { font-size: 1.75rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0; font-size: 1.02rem; }
  .download { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .download a {
    flex: 1 1 200px; padding: 11px 16px; border-radius: 10px; line-height: 1.4;
    background: var(--card); border: 1px solid var(--accent); color: var(--fg); text-decoration: none;
  }
  .download a:hover, .download a:focus-visible { background: var(--accent); color: var(--bg); }
  .download small { display: block; font-size: 0.8rem; color: var(--muted); }
  .download a:hover small, .download a:focus-visible small { color: inherit; }
  .download strong { font-size: 1.05rem; }
  .more { margin-top: 28px; font-size: 0.92rem; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <h1>서울육아</h1>
  <p class="lead">휴대폰에 맞는 스토어로 이동합니다. 이동하지 않으면 아래에서 골라 주세요.</p>
  <div class="download">
    <a href="https://play.google.com/store/apps/details?id=kr.moamoa.news"><small>Android에서 받기</small><strong>Google Play</strong></a>
    <a href="https://apps.apple.com/kr/app/id6820169217"><small>iPhone에서 받기</small><strong>App Store</strong></a>
    <a href="https://tossminiapp.com/s/d9cB72w3"><small>토스 앱에서 열기</small><strong>앱인토스</strong></a>
  </div>
  <p class="more"><a href="./">서울육아 소개 · 문의 · 약관 보기</a></p>
</main>
</body>
</html>
